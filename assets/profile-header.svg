<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title description">
  <title id="title">Data science meets neural systems.</title>
  <desc id="description">Data, learning, and the brain. Neuroscience, machine learning, and neurotechnology. An abstract network of connected nodes decorates a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A31"/>
      <stop offset="1" stop-color="#080E1E"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="73%" cy="25%" r="65%">
      <stop offset="0" stop-color="#6366F1" stop-opacity=".19"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="97%" cy="85%" r="55%">
